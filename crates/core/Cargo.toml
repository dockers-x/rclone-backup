[package]
name = "rclone-backup-core"
version = "2.1.0"
edition = "2024"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.15"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.47", features = ["net"] }
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v4"] }

[dev-dependencies]
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
