[package]
name = "rclone-backup"
version = "2.0.6"
edition = "2024"
license = "MIT"
description = "Rclone-powered backup orchestrator with a bilingual Web UI"
repository = "https://github.com/dockers-x/rclone-backup"

[workspace]
members = [
    ".",
    "crates/api",
    "crates/core",
    "crates/notifications",
    "crates/rclone",
    "crates/runner",
    "crates/store",
]
resolver = "3"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
rclone-backup-api = { path = "crates/api" }
rclone-backup-core = { path = "crates/core" }
rclone-backup-rclone = { path = "crates/rclone" }
rclone-backup-runner = { path = "crates/runner" }
rclone-backup-store = { path = "crates/store" }
serde_json = "1.0"
shell-words = "1.1"
tokio = { version = "1.47", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[dev-dependencies]

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
