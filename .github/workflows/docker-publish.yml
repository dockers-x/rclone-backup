name: Container images

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify release tag
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[package\]/,/^\[/ s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "${version}"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --test web/app.test.js
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.platform }} image
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            platform_tag: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            platform_tag: arm64
    env:
      BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push native image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            docker.io/czyt/rclone-backup:build-${{ github.sha }}-${{ env.BUILD_ID }}-${{ matrix.platform_tag }}
            ghcr.io/dockers-x/rclone-backup:build-${{ github.sha }}-${{ env.BUILD_ID }}-${{ matrix.platform_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=rclone-backup-${{ matrix.platform_tag }}
          cache-to: type=gha,mode=max,scope=rclone-backup-${{ matrix.platform_tag }}
          provenance: true
          sbom: true

  publish:
    name: Publish multi-platform manifests
    needs: [test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and verify manifests
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          major_minor="${version%.*}"
          major="${version%%.*}"
          images=(
            "docker.io/czyt/rclone-backup"
            "ghcr.io/dockers-x/rclone-backup"
          )
          for image in "${images[@]}"; do
            docker buildx imagetools create \
              --tag "${image}:latest" \
              --tag "${image}:${version}" \
              --tag "${image}:${major_minor}" \
              --tag "${image}:${major}" \
              "${image}:build-${GITHUB_SHA}-${BUILD_ID}-amd64" \
              "${image}:build-${GITHUB_SHA}-${BUILD_ID}-arm64"
            docker buildx imagetools inspect --raw "${image}:${version}" \
              | jq -e '
                  [.manifests[]?.platform
                    | select(.os == "linux")
                    | .architecture] as $architectures
                  | ($architectures | index("amd64")) != null
                    and ($architectures | index("arm64")) != null
                ' >/dev/null
          done
