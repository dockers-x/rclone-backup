services:
  backup:
    image: czyt/rclone-backup:2.0.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - rclone-backup-data:/config
      - /path/to/backup:/data:ro
    # Optional Web Basic Auth. Set the user and one password source.
    # For an HTTPS reverse proxy, keep the host port bound to loopback as below.
    # environment:
    #   RCLONE_BACKUP_USER: admin
    #   RCLONE_BACKUP_PASSWORD: change-me
    # Or use a Docker secret instead of a plaintext password:
    #   RCLONE_BACKUP_PASSWORD_FILE: /run/secrets/web-password
    # secrets:
    #   - web-password
    # Existing v1 environment variables can remain here. They are imported
    # exactly once when the v2 database is empty, then the Web UI takes over.
    #   BACKUP_FOLDER_NAME: data
    #   BACKUP_FOLDER_PATH: /data
    #   RCLONE_REMOTE_NAME: MyRemote
    #   RCLONE_REMOTE_DIR: /RcloneBackup/
    #   ZIP_TYPE: 7z
    #   ZIP_PASSWORD_FILE: /run/secrets/archive-password

volumes:
  rclone-backup-data:

# secrets:
