services:
  backup:
    image: czyt/rclone-backup:2.0.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - rclone-backup-data:/config
      - /path/to/backup:/data:ro
    # Existing v1 environment variables can remain here. They are imported
    # exactly once when the v2 database is empty, then the Web UI takes over.
    # environment:
    #   BACKUP_FOLDER_NAME: data
    #   BACKUP_FOLDER_PATH: /data
    #   RCLONE_REMOTE_NAME: MyRemote
    #   RCLONE_REMOTE_DIR: /RcloneBackup/
    #   ZIP_TYPE: 7z
    #   ZIP_PASSWORD_FILE: /run/secrets/archive-password

volumes:
  rclone-backup-data:
